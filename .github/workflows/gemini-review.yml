name: 'Gemini PR Assistant'

on:
  pull_request:
    types: ['opened', 'synchronize']
  issue_comment:
    types: ['created']
  pull_request_review_comment:
    types: ['created']
  workflow_dispatch:

permissions:
  contents: 'read'
  pull-requests: 'write'
  issues: 'write'

jobs:
  gemini-assistant:
    if: ${{ github.event_name == 'pull_request' || contains(github.event.comment.body, '@gemini-cli') || github.event_name == 'workflow_dispatch' }}
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Checkout Code'
        uses: 'actions/checkout@v4'

      - name: 'Process with Gemini'
        uses: 'google-github-actions/run-gemini-cli@main'
        env:
          GEMINI_API_KEY: '${{ secrets.GEMINI_API_KEY }}'
