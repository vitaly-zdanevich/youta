name: 'Gemini PR Assistant'

on:
  pull_request:
    types: ['opened', 'synchronize']
  issue_comment:
    types: ['created']
  pull_request_review_comment:
    types: ['created']

permissions:
  contents: 'read'
  pull-requests: 'write'
  issues: 'write'

jobs:
  gemini-assistant:
    # Run on PR events, or whenever a comment mentions @gemini-cli
    if: ${{ github.event_name == 'pull_request' || contains(github.event.comment.body, '@gemini-cli') }}
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Checkout Code'
        uses: 'actions/checkout@v4'

      - name: 'Process with Gemini'
        uses: 'google-github-actions/run-gemini-cli@main'
        with:
          api_key: '${{ secrets.GEMINI_API_KEY }}'
