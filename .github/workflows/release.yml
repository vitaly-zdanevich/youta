name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: 1.95.0

jobs:
  validate:
    name: Validate release revision
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out the release revision
        uses: actions/checkout@v6

      - name: Require a matching version tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          package_version=$(
            sed -n \
              '/^\[package\]$/,/^\[/s/^version = "\(.*\)"/\1/p' \
              Cargo.toml |
              head -n 1
          )
          expected_tag="v${package_version}"
          if [ "${RELEASE_TAG}" != "${expected_tag}" ]; then
            echo "Release tag ${RELEASE_TAG} does not match ${expected_tag}." >&2
            exit 1
          fi

      # A tag push starts the ordinary CI and release workflows concurrently.
      # Repeat every deterministic release gate here so assets cannot publish
      # before formatting, lint, documentation, or tests have passed.
      - name: Install the release-validation Rust toolchain
        run: |
          rustup toolchain install "${RUST_VERSION}" \
            --profile minimal \
            --component clippy,rustfmt
          rustup default "${RUST_VERSION}"

      - name: Restore Cargo registry cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: release-validation-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run blocking Clippy lint groups
        run: >-
          cargo clippy --locked --all-targets --all-features --
          -D unused
          -D future-incompatible
          -D clippy::correctness
          -D clippy::suspicious
          -D clippy::perf

      - name: Check Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps --all-features

      - name: Run the complete deterministic feature matrix
        run: |
          cargo test --locked --all-targets
          cargo test --locked --all-targets --no-default-features
          cargo test --locked --all-targets --no-default-features --features app-core
          cargo test --locked --all-targets --no-default-features --features app-core,images
          cargo test --locked --all-targets --no-default-features --features app-core,images,qr
          cargo test --locked --lib --no-default-features --features librivox
          cargo test --locked --all-targets --no-default-features --features tui,librivox
          cargo test --locked --all-targets --no-default-features --features tui,librivox,wikidata
          cargo test --locked --all-targets --no-default-features --features app
          cargo test --locked --all-targets --no-default-features --features app,images
          cargo test --locked --all-targets --no-default-features --features app,qr
          cargo test --locked --all-targets --no-default-features --features sqlite-state
          cargo test --locked --all-targets --no-default-features --features tui
          cargo test --locked --all-targets --no-default-features --features qr
          cargo test --locked --all-targets --no-default-features --features tui,local
          cargo test --locked --all-targets --no-default-features --features tui,acoustid,wikidata
          cargo test --locked --all-targets --no-default-features --features tui,apple-podcasts
          cargo test --locked --all-targets --no-default-features --features tui,bandcamp
          cargo test --locked --all-targets --no-default-features --features tui,radio
          cargo test --locked --all-targets --no-default-features --features tui,yandex-music
          cargo test --locked --all-targets --no-default-features --features tui,yandex-music,wikidata
          cargo test --locked --all-targets --all-features

      - name: Run the explicit end-to-end terminal test
        env:
          TERM: xterm-256color
        run: cargo test --locked --test e2e --all-features

      - name: Run the complete Rustdoc test matrix
        run: |
          cargo test --locked --doc
          cargo test --locked --doc --no-default-features
          cargo test --locked --doc --no-default-features --features app-core
          cargo test --locked --doc --no-default-features --features app-core,images
          cargo test --locked --doc --no-default-features --features app-core,images,qr
          cargo test --locked --doc --no-default-features --features librivox
          cargo test --locked --doc --no-default-features --features tui,librivox
          cargo test --locked --doc --no-default-features --features tui,librivox,wikidata
          cargo test --locked --doc --no-default-features --features app
          cargo test --locked --doc --no-default-features --features app,images
          cargo test --locked --doc --no-default-features --features app,qr
          cargo test --locked --doc --no-default-features --features sqlite-state
          cargo test --locked --doc --no-default-features --features tui
          cargo test --locked --doc --no-default-features --features qr
          cargo test --locked --doc --no-default-features --features tui,local
          cargo test --locked --doc --no-default-features --features tui,acoustid,wikidata
          cargo test --locked --doc --no-default-features --features tui,apple-podcasts
          cargo test --locked --doc --no-default-features --features tui,bandcamp
          cargo test --locked --doc --no-default-features --features tui,radio
          cargo test --locked --doc --no-default-features --features tui,yandex-music
          cargo test --locked --doc --no-default-features --features tui,yandex-music,wikidata
          cargo test --locked --doc --all-features

  binaries:
    name: ${{ matrix.operating_system }} ${{ matrix.architecture }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - operating_system: Linux
            artifact_os: linux
            architecture: amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - operating_system: Linux
            artifact_os: linux
            architecture: i686
            runner: ubuntu-24.04
            target: i686-unknown-linux-gnu
          - operating_system: Linux
            artifact_os: linux
            architecture: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - operating_system: macOS
            artifact_os: macos
            architecture: amd64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - operating_system: macOS
            artifact_os: macos
            architecture: arm64
            runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 10

      - name: Install the release Rust toolchain
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal
          rustup default "${RUST_VERSION}"
          rustup target add "${{ matrix.target }}"

      - name: Install Linux i686 linker support
        if: matrix.target == 'i686-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-multilib libc6-dev-i386

      - name: Restore Cargo registry cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: release-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}

      - name: Read the executable version
        run: |
          version=$(sed -n '/^version = /s/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          test -n "${version}"
          echo "PACKAGE_VERSION=${version}" >> "${GITHUB_ENV}"

      - name: Build the default executable with image support
        run: scripts/package-release.sh "${{ matrix.target }}" dist images

      - name: Build the text-only executable
        run: scripts/package-release.sh "${{ matrix.target }}" dist text

      - name: Build the image executable without QR support
        run: scripts/package-release.sh "${{ matrix.target }}" dist images-no-qr

      - name: Build the text-only executable without QR support
        run: scripts/package-release.sh "${{ matrix.target }}" dist text-no-qr

      # Gentoo's `gpm` USE flag is opt-in. Keep the established unsuffixed
      # executables GPM-enabled, and additionally publish each Linux feature
      # combination without the virtual-console client.
      - name: Build the default Linux executable without GPM support
        if: runner.os == 'Linux'
        run: scripts/package-release.sh "${{ matrix.target }}" dist images-no-gpm

      - name: Build the text-only Linux executable without GPM support
        if: runner.os == 'Linux'
        run: scripts/package-release.sh "${{ matrix.target }}" dist text-no-gpm

      - name: Build the Linux executable without QR or GPM support
        if: runner.os == 'Linux'
        run: scripts/package-release.sh "${{ matrix.target }}" dist images-no-qr-no-gpm

      - name: Build the text-only Linux executable without QR or GPM support
        if: runner.os == 'Linux'
        run: scripts/package-release.sh "${{ matrix.target }}" dist text-no-qr-no-gpm

      # Direct artifacts are single files, so the Actions page and API expose
      # the actual executable instead of a ZIP that contains it.
      - name: Upload the default executable
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: dist/youta-${{ env.PACKAGE_VERSION }}-${{ matrix.artifact_os }}-${{ matrix.architecture }}
          if-no-files-found: error

      - name: Upload the default executable checksum
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: dist/youta-${{ env.PACKAGE_VERSION }}-${{ matrix.artifact_os }}-${{ matrix.architecture }}.sha256
          if-no-files-found: error

      - name: Upload the text-only executable
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: dist/youta-${{ env.PACKAGE_VERSION }}-${{ matrix.artifact_os }}-${{ matrix.architecture }}-text
          if-no-files-found: error

      - name: Upload the text-only executable checksum
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: dist/youta-${{ env.PACKAGE_VERSION }}-${{ matrix.artifact_os }}-${{ matrix.architecture }}-text.sha256
          if-no-files-found: error

      - name: Upload the image executable without QR support
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: dist/youta-${{ env.PACKAGE_VERSION }}-${{ matrix.artifact_os }}-${{ matrix.architecture }}-no-qr
          if-no-files-found: error

      - name: Upload the image executable checksum without QR support
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: dist/youta-${{ env.PACKAGE_VERSION }}-${{ matrix.artifact_os }}-${{ matrix.architecture }}-no-qr.sha256
          if-no-files-found: error

      - name: Upload the text-only executable without QR support
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: dist/youta-${{ env.PACKAGE_VERSION }}-${{ matrix.artifact_os }}-${{ matrix.architecture }}-text-no-qr
          if-no-files-found: error

      - name: Upload the text-only executable checksum without QR support
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: dist/youta-${{ env.PACKAGE_VERSION }}-${{ matrix.artifact_os }}-${{ matrix.architecture }}-text-no-qr.sha256
          if-no-files-found: error

      - name: Upload the default Linux executable without GPM support
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: dist/youta-${{ env.PACKAGE_VERSION }}-${{ matrix.artifact_os }}-${{ matrix.architecture }}-no-gpm
          if-no-files-found: error

      - name: Upload the default Linux executable checksum without GPM support
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: dist/youta-${{ env.PACKAGE_VERSION }}-${{ matrix.artifact_os }}-${{ matrix.architecture }}-no-gpm.sha256
          if-no-files-found: error

      - name: Upload the text-only Linux executable without GPM support
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: dist/youta-${{ env.PACKAGE_VERSION }}-${{ matrix.artifact_os }}-${{ matrix.architecture }}-text-no-gpm
          if-no-files-found: error

      - name: Upload the text-only Linux executable checksum without GPM support
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: dist/youta-${{ env.PACKAGE_VERSION }}-${{ matrix.artifact_os }}-${{ matrix.architecture }}-text-no-gpm.sha256
          if-no-files-found: error

      - name: Upload the Linux executable without QR or GPM support
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: dist/youta-${{ env.PACKAGE_VERSION }}-${{ matrix.artifact_os }}-${{ matrix.architecture }}-no-qr-no-gpm
          if-no-files-found: error

      - name: Upload the Linux executable checksum without QR or GPM support
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: dist/youta-${{ env.PACKAGE_VERSION }}-${{ matrix.artifact_os }}-${{ matrix.architecture }}-no-qr-no-gpm.sha256
          if-no-files-found: error

      - name: Upload the text-only Linux executable without QR or GPM support
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: dist/youta-${{ env.PACKAGE_VERSION }}-${{ matrix.artifact_os }}-${{ matrix.architecture }}-text-no-qr-no-gpm
          if-no-files-found: error

      - name: Upload the text-only Linux executable checksum without QR or GPM support
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: dist/youta-${{ env.PACKAGE_VERSION }}-${{ matrix.artifact_os }}-${{ matrix.architecture }}-text-no-qr-no-gpm.sha256
          if-no-files-found: error

  desktop:
    name: Desktop ${{ matrix.operating_system }} ${{ matrix.architecture }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - operating_system: Linux
            artifact_os: linux
            architecture: amd64
            runner: ubuntu-24.04
            executable_extension: ''
          - operating_system: Linux
            artifact_os: linux
            architecture: arm64
            runner: ubuntu-24.04-arm
            executable_extension: ''
          - operating_system: macOS
            artifact_os: macos
            architecture: amd64
            runner: macos-15-intel
            executable_extension: ''
          - operating_system: macOS
            artifact_os: macos
            architecture: arm64
            runner: macos-15
            executable_extension: ''
          - operating_system: Windows
            artifact_os: windows
            architecture: amd64
            runner: windows-2025
            executable_extension: .exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    # Declared at the job so that a step can ask whether signing material
    # exists: a secret referenced only inside a step is not visible to that
    # step's own condition.
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 10

      - name: Install the release Rust toolchain
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal
          rustup default "${RUST_VERSION}"

      # Node ships with every hosted runner image, and this workflow avoids
      # setup actions on purpose, exactly as the Rust toolchain step does.
      - name: Report the Node used to build the window page
        run: |
          node --version
          npm --version

      # WebKitGTK is the Linux web view, and D-Bus is what the media keys speak
      # there. `librsvg2` and `patchelf` belong to the AppImage bundler rather
      # than to Youta.
      - name: Install the Linux desktop toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libdbus-1-dev \
            librsvg2-dev \
            patchelf

      - name: Restore Cargo registry cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: desktop-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}

      # Signing happens only when the maintainer has supplied the material for
      # it. Without these secrets the bundles are produced unsigned, which is
      # the current state of the project and is documented as such in
      # README.md; the workflow does not pretend otherwise or fail.
      - name: Unlock the macOS signing identity
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
        run: |
          set -Eeuo pipefail
          keychain="${RUNNER_TEMP}/youta-signing.keychain-db"
          password=$(openssl rand -base64 24)
          security create-keychain -p "${password}" "${keychain}"
          security set-keychain-settings -lut 900 "${keychain}"
          security unlock-keychain -p "${password}" "${keychain}"
          printf '%s' "${APPLE_CERTIFICATE}" | base64 --decode > "${RUNNER_TEMP}/certificate.p12"
          security import "${RUNNER_TEMP}/certificate.p12" \
            -k "${keychain}" \
            -P "${APPLE_CERTIFICATE_PASSWORD}" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "${password}" "${keychain}"
          security list-keychain -d user -s "${keychain}" login.keychain-db
          rm -f "${RUNNER_TEMP}/certificate.p12"

      # The packaging boundary translates an absent or empty Apple certificate
      # into Tauri's explicit `--no-sign` mode and preserves configured secrets.
      - name: Build the desktop bundles
        run: scripts/package-desktop.sh dist-desktop

      - name: Read the desktop version
        run: |
          version=$(sed -n '/^version = /s/^version = "\(.*\)"/\1/p' gui/Cargo.toml | head -n 1)
          test -n "${version}"
          echo "DESKTOP_VERSION=${version}" >> "${GITHUB_ENV}"

      - name: Upload the standalone GUI executable
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: dist-desktop/youta-gui-${{ env.DESKTOP_VERSION }}-${{ matrix.artifact_os }}-${{ matrix.architecture }}${{ matrix.executable_extension }}
          if-no-files-found: error

      - name: Upload the standalone GUI executable checksum
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: dist-desktop/youta-gui-${{ env.DESKTOP_VERSION }}-${{ matrix.artifact_os }}-${{ matrix.architecture }}${{ matrix.executable_extension }}.sha256
          if-no-files-found: error

      - name: Upload the Debian installer
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: dist-desktop/youta-desktop-${{ env.DESKTOP_VERSION }}-${{ matrix.artifact_os }}-${{ matrix.architecture }}.deb
          if-no-files-found: error

      - name: Upload the Debian installer checksum
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: dist-desktop/youta-desktop-${{ env.DESKTOP_VERSION }}-${{ matrix.artifact_os }}-${{ matrix.architecture }}.deb.sha256
          if-no-files-found: error

      - name: Upload the RPM installer
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: dist-desktop/youta-desktop-${{ env.DESKTOP_VERSION }}-${{ matrix.artifact_os }}-${{ matrix.architecture }}.rpm
          if-no-files-found: error

      - name: Upload the RPM installer checksum
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: dist-desktop/youta-desktop-${{ env.DESKTOP_VERSION }}-${{ matrix.artifact_os }}-${{ matrix.architecture }}.rpm.sha256
          if-no-files-found: error

      - name: Upload the AppImage
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: dist-desktop/youta-desktop-${{ env.DESKTOP_VERSION }}-${{ matrix.artifact_os }}-${{ matrix.architecture }}.AppImage
          if-no-files-found: error

      - name: Upload the AppImage checksum
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: dist-desktop/youta-desktop-${{ env.DESKTOP_VERSION }}-${{ matrix.artifact_os }}-${{ matrix.architecture }}.AppImage.sha256
          if-no-files-found: error

      - name: Upload the macOS disk image
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: dist-desktop/youta-desktop-${{ env.DESKTOP_VERSION }}-${{ matrix.artifact_os }}-${{ matrix.architecture }}.dmg
          if-no-files-found: error

      - name: Upload the macOS disk image checksum
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: dist-desktop/youta-desktop-${{ env.DESKTOP_VERSION }}-${{ matrix.artifact_os }}-${{ matrix.architecture }}.dmg.sha256
          if-no-files-found: error

      - name: Upload the Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: dist-desktop/youta-desktop-${{ env.DESKTOP_VERSION }}-${{ matrix.artifact_os }}-${{ matrix.architecture }}.exe
          if-no-files-found: error

      - name: Upload the Windows installer checksum
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: dist-desktop/youta-desktop-${{ env.DESKTOP_VERSION }}-${{ matrix.artifact_os }}-${{ matrix.architecture }}.exe.sha256
          if-no-files-found: error

  desktop-i686:
    name: Desktop Linux i686 executable
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      # Keep pkg-config from falling back to amd64 libraries: a successful
      # cross-build must prove that every GUI dependency is available on x86.
      PKG_CONFIG_ALLOW_CROSS: '1'
      PKG_CONFIG_LIBDIR: /usr/lib/i386-linux-gnu/pkgconfig:/usr/share/pkgconfig
      CARGO_TARGET_I686_UNKNOWN_LINUX_GNU_LINKER: gcc
      CARGO_TARGET_I686_UNKNOWN_LINUX_GNU_RUSTFLAGS: -C link-arg=-m32
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v6

      - name: Install the release Rust toolchain
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal
          rustup default "${RUST_VERSION}"
          rustup target add i686-unknown-linux-gnu

      # Ubuntu publishes the complete WebKitGTK stack as Multi-Arch packages.
      # Install its i386 development files explicitly so the unbundled GUI is
      # genuinely 32-bit; native Linux installers remain amd64/arm64-only.
      - name: Install the Linux i686 desktop toolchain
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install --yes \
            gcc-multilib \
            libc6-dev:i386 \
            libwebkit2gtk-4.1-dev:i386 \
            libgtk-3-dev:i386 \
            libdbus-1-dev:i386

      - name: Restore Cargo registry cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: desktop-linux-i686-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}

      - name: Build the unbundled Linux i686 GUI executable
        run: scripts/package-desktop-executable.sh i686-unknown-linux-gnu dist-desktop

      - name: Verify the executable architecture
        run: file dist-desktop/youta-gui-*-linux-i686 | grep --fixed-strings 'ELF 32-bit LSB pie executable, Intel 80386'

      - name: Read the desktop version
        run: |
          version=$(sed -n '/^version = /s/^version = "\(.*\)"/\1/p' gui/Cargo.toml | head -n 1)
          test -n "${version}"
          echo "DESKTOP_VERSION=${version}" >> "${GITHUB_ENV}"

      - name: Upload the unbundled GUI executable
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: dist-desktop/youta-gui-${{ env.DESKTOP_VERSION }}-linux-i686
          if-no-files-found: error

      - name: Upload the unbundled GUI executable checksum
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: dist-desktop/youta-gui-${{ env.DESKTOP_VERSION }}-linux-i686.sha256
          if-no-files-found: error

  vendor:
    name: Vendored Cargo dependencies
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v6

      - name: Install the release Rust toolchain
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal
          rustup default "${RUST_VERSION}"

      # The vendor archive proves that every workspace member builds offline,
      # so this job needs the GUI's native link inputs as well as Rust.
      - name: Install the source-package GUI toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libdbus-1-dev

      - name: Restore Cargo registry cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: vendor-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}

      # Source packages build the Rust GUI offline. Give the vendor archive the
      # production page once here so downstream package managers never need npm.
      - name: Build the GUI frontend for offline source packages
        run: |
          node --version
          npm --version
          npm --prefix gui/ui ci
          npm --prefix gui/ui run build

      - name: Set reproducible archive timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "${GITHUB_ENV}"

      - name: Create dependency archive
        run: scripts/package-vendor.sh dist

      # The source-only vendor bundle is the deliberate archive exception: it
      # is input for offline compilation rather than a program to execute.
      - name: Upload the dependency archive
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: dist/youta-*-vendor.tar.xz
          if-no-files-found: error

      - name: Upload the dependency archive checksum
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: dist/youta-*-vendor.tar.xz.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - binaries
      - desktop
      - desktop-i686
      - vendor
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Validate the complete release asset set
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -Eeuo pipefail
          version=${RELEASE_TAG#v}
          platforms=(linux-amd64 linux-i686 linux-arm64 macos-amd64 macos-arm64)
          suffixes=('' -text -no-qr -text-no-qr)
          expected=()
          for platform in "${platforms[@]}"; do
            for suffix in "${suffixes[@]}"; do
              executable="youta-${version}-${platform}${suffix}"
              expected+=("${executable}" "${executable}.sha256")
            done
          done
          linux_platforms=(linux-amd64 linux-i686 linux-arm64)
          no_gpm_suffixes=(-no-gpm -text-no-gpm -no-qr-no-gpm -text-no-qr-no-gpm)
          for platform in "${linux_platforms[@]}"; do
            for suffix in "${no_gpm_suffixes[@]}"; do
              executable="youta-${version}-${platform}${suffix}"
              expected+=("${executable}" "${executable}.sha256")
            done
          done
          # The desktop window ships installers rather than tarballs, and each
          # platform has its own: what a user double-clicks on Windows is not
          # what a user double-clicks on Fedora. The table is written out rather
          # than derived so that a bundler silently producing one format fewer
          # fails the release instead of shrinking it.
          # The GUI/core version-sync regression test lets this checkout-free
          # job use the version already validated against the release tag.
          desktop_version=${version}
          desktop_bundles=(
            'linux-amd64:deb rpm AppImage'
            'linux-arm64:deb rpm AppImage'
            'macos-amd64:dmg'
            'macos-arm64:dmg'
            'windows-amd64:exe'
          )
          desktop_executables=(linux-amd64 linux-i686 linux-arm64 macos-amd64 macos-arm64 windows-amd64)
          for platform in "${desktop_executables[@]}"; do
            extension=
            [[ ${platform} == windows-* ]] && extension=.exe
            gui_executable="youta-gui-${version}-${platform}${extension}"
            expected+=("${gui_executable}" "${gui_executable}.sha256")
          done
          for entry in "${desktop_bundles[@]}"; do
            platform=${entry%%:*}
            for extension in ${entry#*:}; do
              bundle="youta-desktop-${desktop_version}-${platform}.${extension}"
              expected+=("${bundle}" "${bundle}.sha256")
            done
          done

          vendor_archive="youta-${version}-vendor.tar.xz"
          expected+=("${vendor_archive}" "${vendor_archive}.sha256")

          readonly expected_asset_count=96
          ((${#expected[@]} == expected_asset_count)) || {
            echo "Internal release contract generated ${#expected[@]} assets; expected ${expected_asset_count}." >&2
            exit 1
          }

          mapfile -t actual < <(
            find dist -mindepth 1 -maxdepth 1 -type f -printf '%f\n' |
              LC_ALL=C sort
          )
          mapfile -t expected_sorted < <(
            printf '%s\n' "${expected[@]}" |
              LC_ALL=C sort
          )
          ((${#actual[@]} == expected_asset_count)) || {
            echo "Downloaded ${#actual[@]} release assets; expected ${expected_asset_count}." >&2
            printf 'Downloaded asset: %s\n' "${actual[@]}" >&2
            exit 1
          }
          diff --unified \
            --label expected-assets \
            --label downloaded-assets \
            <(printf '%s\n' "${expected_sorted[@]}") \
            <(printf '%s\n' "${actual[@]}") || {
              echo 'Downloaded release asset names do not match the release contract.' >&2
              exit 1
            }

          (cd dist && sha256sum --check --strict -- *.sha256)

      # GitHub CLI is preinstalled on the hosted runner. Using it avoids a
      # third-party release action and keeps token permissions explicit.
      - name: Create or update the tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          mapfile -d '' assets < <(find dist -maxdepth 1 -type f -print0 | sort -z)
          ((${#assets[@]} > 0)) || {
            echo 'No release assets were downloaded.' >&2
            exit 1
          }

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${assets[@]}" --clobber
          else
            gh release create "${RELEASE_TAG}" \
              "${assets[@]}" \
              --verify-tag \
              --generate-notes
          fi
