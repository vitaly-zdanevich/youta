name: Build

# Called only after CI has generated this run's coverage artifact. Keeping
# analysis in the original run preserves pull-request context and secret scope.
on:
  workflow_call:
    secrets:
      SONAR_TOKEN:
        required: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      SONAR_TOKEN_AVAILABLE: ${{ secrets.SONAR_TOKEN != '' }}
    steps:
      - name: Check out the complete history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Download this run's coverage report
        uses: actions/download-artifact@v8
        with:
          name: coverage-lcov
          path: coverage

      - name: Verify the coverage report
        run: test -s coverage/lcov.info

      - name: Report unavailable SonarCloud credentials
        if: ${{ env.SONAR_TOKEN_AVAILABLE != 'true' }}
        run: echo 'SONAR_TOKEN is not configured; LCOV succeeded and SonarCloud analysis was skipped.'

      - name: Analyze with SonarCloud
        if: ${{ env.SONAR_TOKEN_AVAILABLE == 'true' }}
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
