name: Build

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  RUST_VERSION: 1.95.0

jobs:
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      SONAR_TOKEN_AVAILABLE: ${{ secrets.SONAR_TOKEN != '' }}
    steps:
      - name: Check out the complete history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Install Rust coverage tools
        run: |
          rustup toolchain install "${RUST_VERSION}" \
            --profile minimal \
            --component llvm-tools-preview
          rustup default "${RUST_VERSION}"

      - name: Restore Cargo build cache
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: |
            target
            ~/.cargo/registry
            ~/.cargo/git
          key: sonar-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            sonar-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_VERSION }}-

      - name: Restore cargo-llvm-cov binary cache
        id: cargo-llvm-cov-cache
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: ~/.cargo/bin/cargo-llvm-cov
          key: cargo-llvm-cov-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_VERSION }}-0.8.7-v1

      - name: Install the pinned coverage runner
        if: steps.cargo-llvm-cov-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-llvm-cov --locked --version 0.8.7

      - name: Show the coverage runner version
        run: cargo llvm-cov --version

      - name: Generate LCOV coverage
        run: |
          cargo llvm-cov \
            --locked \
            --workspace \
            --all-features \
            --lib \
            --bins \
            --fail-under-lines 70 \
            --lcov \
            --output-path lcov.info
          mkdir -p coverage
          mv lcov.info coverage/lcov.info

      - name: Upload LCOV coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonarcloud-lcov
          path: coverage/lcov.info
          if-no-files-found: error

      - name: Report unavailable SonarCloud credentials
        if: ${{ env.SONAR_TOKEN_AVAILABLE != 'true' }}
        run: echo 'SONAR_TOKEN is not configured; LCOV succeeded and SonarCloud analysis was skipped.'

      - name: Analyze with SonarCloud
        if: ${{ env.SONAR_TOKEN_AVAILABLE == 'true' }}
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
