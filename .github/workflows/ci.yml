  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out sources
        uses: actions/checkout@v6

      - name: Install Rust with coverage tools
        run: |
          rustup toolchain install "${RUST_VERSION}" \
            --profile minimal \
            --component llvm-tools-preview
          rustup default "${RUST_VERSION}"

      - name: Restore Cargo registry cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}

      - name: Install the pinned coverage runner
        run: cargo install cargo-llvm-cov --locked --version 0.8.7

      # `youta-gui` is excluded deliberately, and the exclusion now means
      # something narrower than it used to: the `desktop` job compiles, tests,
      # and lints the window on all three platforms, so it is no longer
      # unchecked — it is only unmeasured.
      #
      # Measuring it would mean installing the WebKitGTK and glib development
      # packages on the coverage runner and instrumenting a crate that is a
      # thin shell over the reducer this gate already covers. The line
      # percentage would move without telling anyone anything.
      - name: Generate LCOV report
        run: |
          cargo llvm-cov \
            --locked \
            --workspace \
            --exclude youta-gui \
            --all-features \
            --lib \
            --bins \
            --fail-under-lines 70 \
            --lcov \
            --output-path lcov.info

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: error
