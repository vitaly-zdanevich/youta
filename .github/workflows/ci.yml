name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.sha }}
  # Every pushed revision must finish the complete suite, including live
  # service checks, even when another revision is pushed soon afterwards.
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'
  RUST_VERSION: 1.95.0

jobs:
  lint:
    name: Formatting, Clippy, and Rustdoc
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out sources
        uses: actions/checkout@v6

      # Use shell-based rustup so CI does not pull in a Node 20 setup action.
      - name: Install the minimum Rust toolchain
        run: |
          rustup toolchain install "${RUST_VERSION}" \
            --profile minimal \
            --component clippy,rustfmt
          rustup default "${RUST_VERSION}"

      - name: Restore Cargo registry cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run blocking Clippy lint groups
        # The manifest still reports style, complexity, and pedantic advice.
        # CI blocks compiler hygiene plus Clippy's bug-risk and performance
        # groups while that advisory backlog is reduced in focused changes.
        run: >-
          cargo clippy --locked --all-targets --all-features --
          -D unused
          -D future-incompatible
          -D clippy::correctness
          -D clippy::suspicious
          -D clippy::perf

      - name: Check Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps --all-features

  test:
    name: Deterministic tests (${{ matrix.feature_set }})
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - feature_set: default features
            feature_arguments: ''
          - feature_set: no default features
            feature_arguments: --no-default-features
          - feature_set: text-only application with QR
            feature_arguments: --no-default-features --features app,qr
          - feature_set: graphical application without QR
            feature_arguments: --no-default-features --features app,images
          - feature_set: application without images or QR
            feature_arguments: --no-default-features --features app
          - feature_set: Yandex-free application without images or QR
            feature_arguments: --no-default-features --features app-core
          - feature_set: Yandex-free graphical application
            feature_arguments: --no-default-features --features app-core,images,qr
          - feature_set: optional SQLite state
            feature_arguments: --no-default-features --features sqlite-state
          - feature_set: TUI only
            feature_arguments: --no-default-features --features tui
          - feature_set: standalone QR TUI
            feature_arguments: --no-default-features --features qr
          - feature_set: TUI with Local
            feature_arguments: --no-default-features --features tui,local
          - feature_set: TUI with AcoustID
            feature_arguments: --no-default-features --features tui,acoustid,wikidata
          - feature_set: TUI with Apple Podcasts
            feature_arguments: --no-default-features --features tui,apple-podcasts
          - feature_set: TUI with Bandcamp
            feature_arguments: --no-default-features --features tui,bandcamp
          - feature_set: TUI with Radio
            feature_arguments: --no-default-features --features tui,radio
          - feature_set: TUI with standalone Yandex Music
            feature_arguments: --no-default-features --features tui,yandex-music
          - feature_set: TUI with Yandex Music
            feature_arguments: --no-default-features --features tui,yandex-music,wikidata
          - feature_set: all features
            feature_arguments: --all-features
    steps:
      - name: Check out sources
        uses: actions/checkout@v6

      - name: Install the minimum Rust toolchain
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal
          rustup default "${RUST_VERSION}"

      - name: Restore Cargo registry cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}

      - name: Run all deterministic test targets
        run: cargo test --locked --all-targets ${{ matrix.feature_arguments }}

      - name: Run Rustdoc tests
        run: cargo test --locked --doc ${{ matrix.feature_arguments }}

  feature-contract:
    name: Optional feature compile contract
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out sources
        uses: actions/checkout@v6

      - name: Install the minimum Rust toolchain
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal
          rustup default "${RUST_VERSION}"

      - name: Restore Cargo registry cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: feature-contract-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}

      # Keep the small capability features independently compilable. This is
      # deliberately a check matrix rather than another set of duplicate test
      # jobs; the complete default and all-feature suites exercise behavior.
      - name: Check supported feature boundaries
        run: |
          cargo check --locked --no-default-features --features cli --bin youta
          cargo check --locked --no-default-features --features subscriptions --lib
          cargo check --locked --no-default-features --features tui
          cargo check --locked --no-default-features --features qr
          cargo check --locked --no-default-features --features images
          cargo check --locked --no-default-features --features waveform --lib
          cargo check --locked --no-default-features --features acoustid --lib
          cargo check --locked --no-default-features --features tui,waveform
          cargo check --locked --no-default-features --features tui,local-browser
          cargo check --locked --no-default-features --features tui,local-metadata
          cargo check --locked --no-default-features --features tui,local-rename
          cargo check --locked --no-default-features --features tui,local-trash
          cargo check --locked --no-default-features --features tui,local-move
          cargo check --locked --no-default-features --features images,local-artwork
          cargo check --locked --no-default-features --features tui,local
          cargo check --locked --no-default-features --features app-core
          cargo check --locked --no-default-features --features app-core,images
          cargo check --locked --no-default-features --features app-core,images,qr
          cargo check --locked --no-default-features --features tui,yandex-music
          cargo check --locked --no-default-features --features app
          cargo check --locked --no-default-features --features app,images
          cargo check --locked --no-default-features --features app,qr

  windows-compile:
    name: Windows compile (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
          - architecture: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    steps:
      - name: Check out sources
        uses: actions/checkout@v6

      - name: Install the minimum Rust toolchain
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal
          rustup default "${RUST_VERSION}"
          rustup target add "${{ matrix.target }}"

      - name: Restore Cargo registry cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: windows-compile-${{ matrix.architecture }}-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}

      # Windows remains compile-only until the mpv backend has named-pipe IPC
      # and the platform opener replaces the Unix-only runtime adapters.
      - name: Check the standard application
        run: cargo check --locked --target "${{ matrix.target }}"

      - name: Check the text-only application with QR
        run: >-
          cargo check --locked --target "${{ matrix.target }}"
          --no-default-features --features app,qr

      - name: Check the application without QR
        run: >-
          cargo check --locked --target "${{ matrix.target }}"
          --no-default-features --features app

  freebsd-compile:
    name: FreeBSD compile feasibility
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out sources
        uses: actions/checkout@v6

      - name: Install the minimum Rust toolchain
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal
          rustup default "${RUST_VERSION}"
          rustup target add x86_64-unknown-freebsd

      - name: Restore Cargo registry cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: freebsd-compile-x86_64-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}

      # GitHub has no native FreeBSD runner. `cargo check` validates the core
      # TUI and Unix mpv code without pretending that an unexecuted artifact is
      # a tested release binary.
      - name: Check the portable TUI and local browser
        run: >-
          cargo check --locked --target x86_64-unknown-freebsd
          --no-default-features
          --features tui,local-browser,backend-mpv

  e2e:
    name: End-to-end terminal test
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out sources
        uses: actions/checkout@v6

      - name: Install the minimum Rust toolchain
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal
          rustup default "${RUST_VERSION}"

      - name: Restore Cargo registry cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}

      - name: Run the explicit end-to-end target
        env:
          TERM: xterm-256color
        run: cargo test --locked --test e2e --all-features

  live-youtube:
    name: Live YouTube playback
    # GitHub-hosted egress currently receives YouTube's LOGIN_REQUIRED
    # response even with the account-free PO-token provider. Keep this job
    # ready to re-enable, and run scripts/test-live-youtube.sh locally before
    # each commit in the meantime. Set the repository Actions variable
    # RUN_LIVE_YOUTUBE to true when the hosted check is reliable again.
    if: ${{ vars.RUN_LIVE_YOUTUBE == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out sources
        uses: actions/checkout@v6

      - name: Install the minimum Rust toolchain
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal
          rustup default "${RUST_VERSION}"

      - name: Restore Cargo registry cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}

      # yt-dlp's supported JavaScript challenge solver uses this runtime.
      # setup-deno v2.0.5 is pinned to its Node 24 action commit.
      - name: Install the Deno runtime
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.4

      - name: Install playback helpers
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3-venv
          /home/linuxbrew/.linuxbrew/bin/brew install mpv
          mpv_path="$(
            /home/linuxbrew/.linuxbrew/bin/brew --prefix mpv
          )/bin/mpv"
          "${mpv_path}" --version
          echo "YOUTA_TEST_MPV=${mpv_path}" >> "${GITHUB_ENV}"
          python3 -m venv /tmp/youta-live-venv
          /tmp/youta-live-venv/bin/pip \
            install \
            --disable-pip-version-check \
            'yt-dlp[default,pin]==2026.7.4' \
            'bgutil-ytdlp-pot-provider==1.3.1'

      - name: Start the account-free YouTube PO-token provider
        run: |
          yt_dlp_wrapper="${RUNNER_TEMP}/youta-live-yt-dlp"
          {
            printf '%s\n' '#!/bin/sh'
            printf '%s\n' \
              'exec /tmp/youta-live-venv/bin/yt-dlp --verbose --extractor-args "youtube:player_client=default,web_embedded" "$@"'
          } > "${yt_dlp_wrapper}"
          chmod 700 "${yt_dlp_wrapper}"
          echo "YOUTA_TEST_YT_DLP=${yt_dlp_wrapper}" >> "${GITHUB_ENV}"

          # Pin the Deno image and its multi-architecture manifest.
          docker run \
            --detach \
            --init \
            --name youta-bgutil-provider \
            --log-driver none \
            --publish 127.0.0.1:4416:4416 \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            docker.io/brainicism/bgutil-ytdlp-pot-provider:1.3.1-deno@sha256:bea3cfda79245700d7ad90500052b4358b1c1828fdc0961929624b83933121bc
          for attempt in {1..30}; do
            if curl \
              --fail \
              --silent \
              --max-time 2 \
              http://127.0.0.1:4416/ping \
              | jq --exit-status \
                '.version == "1.3.1" and (.server_uptime | type == "number")' \
                > /dev/null
            then
              exit 0
            fi
            sleep 1
          done
          docker inspect \
            --format 'running={{.State.Running}} exit={{.State.ExitCode}} error={{.State.Error}}' \
            youta-bgutil-provider
          exit 1

      - name: Resolve and decode real YouTube audio
        env:
          YOUTA_RUN_LIVE_YOUTUBE_TEST: '1'
        run: |
          for attempt in 1 2; do
            if cargo test \
              --locked \
              --test live_youtube \
              --all-features \
              -- \
              --ignored \
              --exact youtube_audio_playback_advances_and_shuts_down \
              --nocapture
            then
              exit 0
            fi
            if [ "${attempt}" -eq 2 ]; then
              exit 1
            fi
            sleep 10
          done

      - name: Stop the YouTube PO-token provider
        if: always()
        run: |
          docker rm --force youta-bgutil-provider > /dev/null 2>&1 || true
          rm -f -- "${RUNNER_TEMP}/youta-live-yt-dlp"

      - name: Fetch and render a real YouTube thumbnail
        env:
          YOUTA_RUN_LIVE_THUMBNAIL_TEST: '1'
        run: |
          for attempt in 1 2; do
            if cargo test \
              --locked \
              --lib \
              --all-features \
              -- \
              --ignored \
              --exact thumbnails::tests::live_youtube_thumbnail_leaves_loading_with_a_ready_protocol \
              --nocapture
            then
              exit 0
            fi
            if [ "${attempt}" -eq 2 ]; then
              exit 1
            fi
            sleep 10
          done

  live-youtube-music:
    name: Live keyless YouTube Music search
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out sources
        uses: actions/checkout@v6

      - name: Install the minimum Rust toolchain
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal
          rustup default "${RUST_VERSION}"

      - name: Restore Cargo registry cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}

      - name: Install the pinned yt-dlp search helper
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3-venv
          python3 -m venv "${RUNNER_TEMP}/youta-live-music-venv"
          "${RUNNER_TEMP}/youta-live-music-venv/bin/pip" \
            install \
            --disable-pip-version-check \
            'yt-dlp[default]==2026.7.4'
          echo "YOUTA_TEST_YT_DLP=${RUNNER_TEMP}/youta-live-music-venv/bin/yt-dlp" \
            >> "${GITHUB_ENV}"

      - name: Search the public YouTube Music songs section
        env:
          YOUTA_RUN_LIVE_YOUTUBE_MUSIC_TEST: '1'
        run: |
          for attempt in 1 2; do
            if cargo test \
              --locked \
              --test live_services \
              --no-default-features \
              --features youtube-music \
              -- \
              --ignored \
              --exact youtube_music_keyless_search_returns_playable_tracks_before_timeout \
              --nocapture
            then
              exit 0
            fi
            if [ "${attempt}" -eq 2 ]; then
              exit 1
            fi
            sleep 10
          done

  live-apple-podcasts:
    name: Live Apple Podcasts playback
    # Ubuntu 24.04 packages mpv 0.37, older than Youta's documented 0.38
    # minimum and its indexed `loadfile` JSON-IPC command.
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    steps:
      - name: Check out sources
        uses: actions/checkout@v6

      - name: Install the minimum Rust toolchain
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal
          rustup default "${RUST_VERSION}"

      - name: Restore Cargo registry cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}

      - name: Install the playback helper
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg mpv
          mpv --version
          dpkg --compare-versions \
            "$(dpkg-query --show --showformat='${Version}' mpv)" \
            ge \
            0.38

      - name: Search Apple Podcasts and list a show's episodes
        env:
          YOUTA_RUN_LIVE_APPLE_PODCASTS_SEARCH_TEST: '1'
        run: |
          for attempt in 1 2; do
            if cargo test \
              --locked \
              --test live_services \
              --no-default-features \
              --features apple-podcasts \
              -- \
              --ignored \
              --exact apple_podcasts_public_search_returns_normalized_shows \
              --nocapture
            then
              exit 0
            fi
            if [ "${attempt}" -eq 2 ]; then
              exit 1
            fi
            sleep 10
          done

      - name: Resolve Apple metadata, RSS, and audio
        env:
          YOUTA_RUN_LIVE_APPLE_PODCASTS_TEST: '1'
        run: |
          for attempt in 1 2; do
            if cargo test \
              --locked \
              --test live_services \
              --no-default-features \
              --features apple-podcasts,backend-mpv \
              -- \
              --ignored \
              --exact apple_podcasts_lookup_rss_and_audio_are_usable \
              --nocapture
            then
              exit 0
            fi
            if [ "${attempt}" -eq 2 ]; then
              exit 1
            fi
            sleep 10
          done

  live-wikidata:
    name: Live Wikidata lookup
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out sources
        uses: actions/checkout@v6

      - name: Install the minimum Rust toolchain
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal
          rustup default "${RUST_VERSION}"

      - name: Restore Cargo registry cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}

      - name: Find the public YouTube video fixture
        env:
          YOUTA_RUN_LIVE_WIKIDATA_TEST: '1'
        run: |
          for attempt in 1 2; do
            if cargo test \
              --locked \
              --test live_services \
              --no-default-features \
              --features wikidata \
              -- \
              --ignored \
              --exact wikidata_finds_the_youtube_video_fixture_item \
              --nocapture
            then
              exit 0
            fi
            if [ "${attempt}" -eq 2 ]; then
              exit 1
            fi
            sleep 10
          done

      - name: Find the public YouTube channel fixture
        env:
          YOUTA_RUN_LIVE_WIKIDATA_TEST: '1'
        run: |
          for attempt in 1 2; do
            if cargo test \
              --locked \
              --test live_services \
              --no-default-features \
              --features wikidata \
              -- \
              --ignored \
              --exact wikidata_finds_the_youtube_channel_fixture_item \
              --nocapture
            then
              exit 0
            fi
            if [ "${attempt}" -eq 2 ]; then
              exit 1
            fi
            sleep 10
          done

      - name: Load public media statements
        env:
          YOUTA_RUN_LIVE_WIKIDATA_TEST: '1'
        run: |
          for attempt in 1 2; do
            if cargo test \
              --locked \
              --test live_services \
              --no-default-features \
              --features wikidata \
              -- \
              --ignored \
              --exact wikidata_loads_the_media_fixture_statements \
              --nocapture
            then
              exit 0
            fi
            if [ "${attempt}" -eq 2 ]; then
              exit 1
            fi
            sleep 10
          done

      - name: Load public follower history
        env:
          YOUTA_RUN_LIVE_WIKIDATA_TEST: '1'
        run: |
          for attempt in 1 2; do
            if cargo test \
              --locked \
              --test live_services \
              --no-default-features \
              --features wikidata \
              -- \
              --ignored \
              --exact wikidata_loads_the_follower_history_fixture \
              --nocapture
            then
              exit 0
            fi
            if [ "${attempt}" -eq 2 ]; then
              exit 1
            fi
            sleep 10
          done

  live-radio:
    name: Live public radio playback
    # The live test supplies per-file titles through the indexed `loadfile`
    # JSON-IPC signature introduced by mpv 0.38.
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    steps:
      - name: Check out sources
        uses: actions/checkout@v6

      - name: Install the minimum Rust toolchain
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal
          rustup default "${RUST_VERSION}"

      - name: Restore Cargo registry cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}

      - name: Install the playback helper
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg mpv
          mpv --version
          dpkg --compare-versions \
            "$(dpkg-query --show --showformat='${Version}' mpv)" \
            ge \
            0.38

      - name: Decode curated public streams and parse passive metadata
        env:
          YOUTA_RUN_LIVE_RADIO_TEST: '1'
        run: |
          for attempt in 1 2; do
            if cargo test \
                --locked \
                --test live_services \
                --no-default-features \
                --features radio,backend-mpv \
                -- \
                --ignored \
                --exact radio_stream_and_passive_metadata_are_usable \
                --nocapture
            then
              exit 0
            fi
            if [ "${attempt}" -eq 2 ]; then
              exit 1
            fi
            sleep 10
          done

      - name: Decode a generated NPR stream and parse its current programme
        env:
          YOUTA_RUN_LIVE_RADIO_TEST: '1'
        run: |
          for attempt in 1 2; do
            if cargo test \
                --locked \
                --test live_services \
                --no-default-features \
                --features radio,backend-mpv \
                -- \
                --ignored \
                --exact generated_npr_station_stream_and_program_are_usable \
                --nocapture
            then
              exit 0
            fi
            if [ "${attempt}" -eq 2 ]; then
              exit 1
            fi
            sleep 10
          done

      - name: Resolve and decode BBC Sounds radio
        env:
          YOUTA_RUN_LIVE_BBC_RADIO_TEST: '1'
        run: |
          for attempt in 1 2; do
            if cargo test \
                --locked \
                --test live_services \
                --no-default-features \
                --features bbc-radio,backend-mpv \
                -- \
                --ignored \
                --exact bbc_sounds_resolution_and_audio_are_usable \
                --nocapture
            then
              exit 0
            fi
            if [ "${attempt}" -eq 2 ]; then
              exit 1
            fi
            sleep 10
          done

  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out sources
        uses: actions/checkout@v6

      - name: Install Rust with coverage tools
        run: |
          rustup toolchain install "${RUST_VERSION}" \
            --profile minimal \
            --component llvm-tools-preview
          rustup default "${RUST_VERSION}"

      - name: Restore Cargo registry cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}

      - name: Install the pinned coverage runner
        run: cargo install cargo-llvm-cov --locked --version 0.8.7

      # `youta-gui` is excluded deliberately. It links Tauri, whose Linux
      # backend needs the WebKitGTK and glib development packages, and pulling
      # that toolchain into the coverage runner to measure a thin window shell
      # is out of proportion to this gate.
      #
      # This is the only workspace-wide invocation in CI, and the desktop crate
      # is not a default workspace member, so nothing here builds or tests the
      # window. Giving it a lane needs a runner with the WebKitGTK development
      # packages installed.
      - name: Generate LCOV report
        run: |
          cargo llvm-cov \
            --locked \
            --workspace \
            --exclude youta-gui \
            --all-features \
            --lib \
            --bins \
            --fail-under-lines 70 \
            --lcov \
            --output-path lcov.info

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: error
