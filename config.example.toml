# Youta configuration example.
#
# Copy this file to ~/.config/youta/config.toml. Set YOUTA_CONFIG_DIR to use a
# different application directory. Environment overrides use the YOUTA_ prefix
# and two underscores for nesting; for example:
#
#   YOUTA_PLAYBACK__VOLUME_PERCENT=40
#
# Persistent state and downloads also remain beneath the application directory.

[playback]
# `mpv` is the implemented external backend. `native` is reserved for a build
# that includes the experimental native backend.
backend = 'mpv'

# One of: `auto`, `alsa`, `jack`, `pulse-audio`, or `pipe-wire`.
output = 'auto'

# Uncomment to select a backend-specific device. For mpv/ALSA this can be a
# value such as `alsa/hw:2,0`. List devices with `mpv --audio-device=help`.
# device = 'alsa/hw:2,0'

volume_percent = 80
speed_percent = 100
resume_rewind_seconds = 30

# Continue with the next playable item from the same YouTube, local, or
# MOD/tracker list after explicitly queued items.
# YOUTA_PLAYBACK__AUTOPLAY has higher precedence.
autoplay = false

# Resolve the selected YouTube video's audio after a 200 ms selection debounce.
# During the final 30 seconds of playback, the same bounded worker may prepare
# one known next queue/autoplay item. Signed media URLs and HTTP headers stay in
# RAM only; normal canonical YouTube playback remains the fallback.
# YOUTA_PLAYBACK__YOUTUBE_PREWARM has higher precedence.
youtube_prewarm = true

# Hide seek-bar entries and automatically skip only chapters whose normalized
# Russian title is exactly `Реклама`. Set this to false to retain and play them.
# YOUTA_PLAYBACK__SKIP_ADVERTISEMENT_CHAPTERS has higher precedence.
skip_advertisement_chapters = true

[playback.audiophile]
# These settings affect Youta/player arguments only. Youta never changes the
# CPU governor, real-time scheduler, kernel parameters, or device permissions.
enabled = false
exclusive_device = false
avoid_resampling = false

# Leave unset to preserve the source/device negotiation. Forcing a rate can
# require resampling and is not automatically a quality improvement.
# output_sample_rate_hz = 96000

[subscriptions]
# Automatic work runs only while Youta is open.
auto_download = true
audio_format = 'opus'
download_thumbnails = true

[ui]
show_button_hotkeys = true

# Subscriptions navigation. `drill-down` is the low-width default: Enter opens
# one source's videos in the normal list + Details layout. `split` keeps
# sources and videos visible together; Enter explicitly loads an uncached
# source. The in-app [p] Preferences popup edits this field.
# YOUTA_UI__SUBSCRIPTIONS_LAYOUT has higher precedence.
subscriptions_layout = 'drill-down'

# Include YouTube Shorts in subscription video lists. The contextual Shorts
# control changes this value without affecting cached videos.
# YOUTA_UI__SHOW_YOUTUBE_SHORTS has higher precedence.
show_youtube_shorts = true

# One of: `auto`, `dark`, or `light`.
theme = 'auto'

# One of: `auto`, `off`, or `on`. Runtime capability checks still suppress
# graphics when no supported image protocol is detected.
thumbnails = 'auto'

# Exact YouTube video-thumbnail entry. One of: `automatic`, `disabled`,
# `default`, `medium`, `high`, `standard`, or `maxres`. Automatic uses
# `high` through 1366 terminal-window pixels, `standard` through 1920 pixels,
# and `maxres` above that.
youtube_thumbnail_size = 'automatic'

# Render ANSI-16 Unicode half-block artwork on a confirmed physical Linux
# `/dev/ttyN`. This does not affect Kitty, iTerm2, or Sixel rendering in
# graphical terminals. YOUTA_UI__SHOW_IMAGES_IN_TTY=false has higher precedence.
show_images_in_tty = true

# Maximum artwork height in terminal rows. Youta reduces it when the Details
# panel is shorter so metadata, links, and description text retain space.
# YouTube thumbnails use the full Details-pane width when their description
# occupies fewer than 15 wrapped rows or the terminal window itself reports a
# height of at least 1080 pixels.
thumbnail_height = 20

# Warm the persistent cache for all currently loaded global Search results in
# one low-priority worker. The selected artwork always has queue priority.
# Persisted artwork for local subscription channels is warmed independently to
# make channel switching reuse cached bytes without foreground network work.
# YOUTA_UI__PREFETCH_SEARCH_THUMBNAILS=false disables this without editing TOML.
prefetch_search_thumbnails = true

# Measure complete recursive sizes for at most 256 Local folders per visit.
# Work is asynchronous, one folder at a time, never follows symbolic links,
# and uses a short-lived bounded RAM cache. Disable this to perform no size
# scans and remove the Local [Z] size-sort control.
# YOUTA_UI__SHOW_LOCAL_FOLDER_SIZES=false has higher precedence.
show_local_folder_sizes = true
seekbar_color = 'cyan'
nyan_cat_seekbar = false
dos_rpg_mode = false

[persistence]
# `files` is the core default and stores deterministic, human-readable TOML
# below ~/.config/youta/state/. `sqlite` requires the `sqlite-state` Cargo
# feature (or `bundled-sqlite`, which includes it). Both can coexist;
# switching this value selects the active state without migrating either one.
# The files backend holds an exclusive state/.lock while Youta is running.
# Close Youta before editing state/*.toml by hand.
backend = 'files'

# Save one new playback History entry after media starts, and expose the
# History tab. Disabling this prevents only new History entries; it does not
# delete existing History or disable playback progress, listening statistics,
# session and cache persistence, or graceful-shutdown Git synchronization.
# YOUTA_PERSISTENCE__SAVE_PLAYBACK_HISTORY has higher precedence.
save_playback_history = true

position_save_interval_seconds = 30
played_threshold_percent = 90

# On a successful graceful shutdown, detect whether the configured Youta root
# is in a Git worktree. If so, run a path-scoped `git add .`, commit changed
# Youta files as `Automatic state update`, and push. Youta never pulls.
# Pending state is flushed and its lock released first; a flush failure skips
# Git synchronization.
# Existing .gitignore rules are authoritative. Set this to false to opt out.
git_commit_on_change = true

[video_summary]
# Video summaries are compiled into default builds but remain off until the
# user explicitly selects Codex here or in Preferences. One of: `off`,
# `codex`. An explicit Summarize action sends only a bounded caption transcript
# through the independently authenticated Codex CLI. Youta never reads or
# copies Codex authentication files and does not add the transcript or result
# to its persistent state. Caption extraction uses a short-lived temporary
# file inside a mode-0700 directory on Unix and inherits the temporary-area ACL
# on Windows. The Codex CLI transmits the transcript to OpenAI. Ephemeral mode
# only disables local Codex session files, and Codex may still load its global
# $CODEX_HOME/AGENTS.md instructions. Youta ignores the Codex user
# configuration, including custom model and provider selection, for this task.
# YOUTA_VIDEO_SUMMARY__BACKEND has higher precedence.
backend = 'off'

# The user-installed Codex CLI executable. Sign in with `codex login` outside
# Youta; this path is not a credential. The environment override is
# YOUTA_VIDEO_SUMMARY__CODEX_EXECUTABLE.
codex_executable = 'codex'

[providers]
# The built-in Radio tab needs no API key or instance URL. It is a static
# catalogue compiled by the `radio` feature; selecting a station is the first
# operation that opens its stream or optional passive metadata endpoint.
#
# Metadata backend for YouTube search and public details. One of: `auto`,
# `official`, or `invidious`. `auto` prefers a YouTube API key from
# secrets/credentials.toml or the environment when the official adapter is
# compiled in, then falls back to `invidious_base_url`.
# Playback remains on the separate yt-dlp/mpv path.
youtube_backend = 'auto'

# Provider base URLs are unset until the user chooses one.
# invidious_base_url = 'https://inv.example.org/'
# peertube_instance_url = 'https://video.example.org/'
# funkwhale_instance_url = 'https://audio.example.org/'

# Mirsoft Game Music Base currently serves its catalog only over unencrypted
# HTTP. The insecure catalog is enabled by default at the user's request and
# triggers a one-time warning. Set this to false to reject Mirsoft and every
# other plain-HTTP provider URL. Youta never sends credentials to Mirsoft.
allow_insecure_http = true

# Preferred Bandcamp audio encoding. `best-available` is the default.
# One of: `best-available`, `flac`, `alac`, `wav`, `aiff`, `mp3-320`, `mp3-v0`,
# `aac`, `ogg-vorbis`, or `public-stream-mp3-128`.
# The in-app [p] Preferences popup cycles this closed set with [b].
# YOUTA_PROVIDERS__BANDCAMP_AUDIO_FORMAT has higher precedence.
bandcamp_audio_format = 'best-available'

# Plaintext credentials belong in ~/.config/youta/secrets/credentials.toml,
# not in this general configuration file:
#
#   [providers]
#   youtube_api_key = '...'
#   mod_archive_api_key = '...'
#   # Register at https://devportal.jamendo.com/; Youta never ships the
#   # documentation/testing client ID.
#   jamendo_client_id = '...'
#   # Create an application key at https://acoustid.org/api-key.
#   acoustid_client_key = '...'
#   # OAuth access token issued for your Yandex Music account. This is not an
#   # API key; Youta never asks for or stores the account password.
#   yandex_music_token = '...'
#
# Environment overrides have the highest precedence, for example:
#
#   YOUTA_PROVIDERS__YOUTUBE_API_KEY='...'
#   YOUTA_PROVIDERS__MOD_ARCHIVE_API_KEY='...'
#   YOUTA_PROVIDERS__JAMENDO_CLIENT_ID='...'
#   YOUTA_PROVIDERS__ACOUSTID_CLIENT_KEY='...'
#   YOUTA_PROVIDERS__YANDEX_MUSIC_TOKEN='...'
#
# If YouTube search has no provider, its TUI setup popup accepts either the API
# key or the Invidious URL above. It shows both exact destinations:
# secrets/credentials.toml for the key and config.toml for the instance URL.
# On Unix, Youta saves private directories with mode 0700 and files with mode
# 0600.
# The popup includes API-key creation/restriction steps plus selectable links
# to Google's official credential guide, Google Cloud Credentials, and the
# official Invidious public-instance list.
# Credentials remain plaintext at rest. The planned keyring adapter is not part
# of the current foundation.

# Helper names may instead be absolute paths.
yt_dlp_executable = 'yt-dlp'
mpv_executable = 'mpv'

# `fpcalc` is supplied by Chromaprint. A media file is passed to it only after
# the user requests local-audio fingerprinting; diagnostics may separately run
# `fpcalc -version`. AcoustID receives the fingerprint and duration, never the
# local path or media bytes.
fpcalc_executable = 'fpcalc'

# FFmpeg estimates source-quality evidence for explicitly selected local audio,
# marked local files or folders, and recursively discovered folder audio,
# draws local waveforms, extracts the midpoint frame used as a local video
# thumbnail, and decodes tracker modules through libopenmpt. FFprobe reads
# codec, bitrate, and exact duration for local media. Both are optional: without
# them those features report themselves unavailable and nothing else changes.
# Windows builds of FFmpeg are usually unpacked rather than installed, so a
# full path is the normal setting there.
ffmpeg_executable = 'ffmpeg'
ffprobe_executable = 'ffprobe'
