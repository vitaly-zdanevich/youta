[workspace]
members = ["gui"]
resolver = "3"

[package]
name = "youta"
version = "0.48.6"
edition = "2024"
rust-version = "1.95"
description = "A low-resource YouTube TUI audio player and local subscription manager that uses yt-dlp and saves and shows listening progress"
license = "MIT"
repository = "https://github.com/vitaly-zdanevich/youta"
homepage = "https://github.com/vitaly-zdanevich/youta"
readme = "README.md"
keywords = ["audio", "podcasts", "terminal", "tui", "youtube"]
categories = ["command-line-utilities", "multimedia::audio"]

[[bin]]
name = "youta"
path = "src/main.rs"
required-features = ["cli"]

[[example]]
name = "update_npr_stations"
path = "examples/update_npr_stations.rs"
required-features = ["radio"]

[[test]]
name = "e2e"
path = "tests/e2e.rs"
required-features = ["cli"]

[features]
default = [
    "app",
    "ascii-visualizer",
    "audio-quality",
    "commons-upload",
    "evernote",
    "gpm",
    "images",
    "local-archives",
    "nyan-cat",
    "qr",
    "sponsorblock",
    "summary",
    "youtube-captions",
]

# Complete application profile shared by default and text-only builds.
#
# Yandex Music is included here so normal builds expose the complete top-level
# source set. `app-core` remains the equivalent profile for distributors and
# users who intentionally omit the private, experimental Yandex Music API.
# Audio-quality analysis, GPM input, image rendering, QR encoding, SponsorBlock,
# video summaries, and SQLite remain independent features. Keeping them outside
# this profile lets system packages map positive options directly to Cargo
# features without subtracting a transitive default.
app = [
    "app-core",
    "yandex-music",
]

# Complete application profile without the optional Yandex Music adapter or
# Linux virtual-console mouse integration.
app-core = ["tui", "sources"]

# Every source adapter and playback helper, without any user interface.
#
# `app-core` is this set plus the terminal front-end. A different front-end
# combines `sources` with `controller` and links no renderer at all.
sources = [
    "acoustid",
    "local",
    "rss",
    "invidious",
    "youtube-official",
    "peertube",
    "vimeo",
    "rutube",
    "bilibili",
    "radio",
    "bbc-radio",
    "funkwhale",
    "jamendo",
    "soundcloud",
    "soundstream",
    "youtube-music",
    "bandcamp",
    "apple-podcasts",
    "librivox",
    "litres",
    "lastfm",
    "dearrow",
    "wikidata",
    "generic-ytdlp",
    "tracker-music",
    "waveform",
    "backend-mpv",
    "yt-dlp",
]

# Command-line parsing and the executable target.
cli = ["dep:anyhow", "dep:clap"]

# Portable local subscriptions and OPML interchange.
subscriptions = ["dep:opml", "dep:percent-encoding"]

# Optional SQLite persistence for users who prefer one transactional database.
sqlite-state = ["dep:rusqlite"]

# Interactive application state without any renderer.
#
# This carries the reducer in `app` and the frontend-agnostic vocabulary in
# `view`. A non-terminal frontend depends on this feature alone and consumes
# `view::ViewModel` and `view::UiAction` without linking Crossterm or Ratatui.
controller = [
    "subscriptions",
    "dep:chrono",
    "dep:crossbeam-channel",
    "dep:toml_edit",
    "dep:unicode-segmentation",
]

# Terminal user interface and playback backends.
tui = [
    "controller",
    "cli",
    "dep:crossterm",
    "dep:ratatui",
]
# Offline QR codes for exact selected YouTube videos.
#
# `src/qr_code.rs` encodes to a plain module matrix and renders nothing, so this
# does not require a front-end. The terminal build reaches it through `tui`,
# which is what every documented build variant selects; a window links the same
# encoder without Ratatui.
qr = ["dep:qrcode"]
# Safe, opportunistic Linux virtual-console mouse input through `/dev/gpmctl`.
# This links no system GPM library; F8 retries a missing daemon and retains its
# keyboard pointer when physical input is unavailable.
gpm = ["tui", "dep:mio"]
backend-mpv = []
backend-native = []
alsa = []
jack = []
pulseaudio = []
pipewire = []
# Lazy local-file peak extraction through the user's existing FFmpeg helper.
waveform = ["local-browser"]
# Optional rainbow Nyan Cat seek-bar rendering shared by both front-ends.
nyan-cat = []
# On-demand local-file spectral analysis through the configured FFmpeg helper.
# Rust performs the bounded FFT analysis; disabling this feature removes both
# the action and its DSP dependency.
audio-quality = ["local-browser", "dep:rustfft", "dep:rustix"]
# Fullscreen CAVA-backed FFT capture and audio-reactive ASCII rendering.
ascii-visualizer = ["dep:crossbeam-channel", "dep:rustix"]
# On-demand YouTube transcript summaries through the user's authenticated
# Codex CLI. Youta continues to own caption retrieval, so the feature selects
# the existing yt-dlp process boundary without adding an SDK or credential
# dependency. Keeping the feature renderer-free lets every front-end expose the
# same capability while distributors remove both its UI and backend.
summary = ["yt-dlp"]
# Searchable, timestamp-accurate YouTube captions shared by every front-end.
# Caption retrieval remains renderer-free and uses the existing bounded yt-dlp
# process boundary, so distributors can remove its controller UI independently.
youtube-captions = ["yt-dlp"]
# Remote artwork fetching and its private on-disk cache, with no renderer.
#
# `src/artwork.rs` turns a provider URL into bytes under Youta's network and
# cache protections. A window links this without Ratatui; the terminal reaches
# it through `images`, which adds decoding and graphics protocols on top.
remote-artwork = ["network", "dep:sha2"]

# Terminal artwork and thumbnail decoding and rendering.
images = [
    "tui",
    "remote-artwork",
    "network",
    "dep:image",
    "dep:jpeg-decoder",
    "dep:ratatui-image",
    "dep:sha2",
]
# Compatibility alias for builds that used the original feature name.
thumbnails = ["images"]
keyring = []

# Shared networking and first-class sources.
network = ["dep:ureq"]
# Explicit, review-first audio transfers to Wikimedia Commons. Cookie and
# multipart support are kept behind this feature so distributors can remove
# the authentication and upload code from constrained builds.
commons-upload = [
    "controller",
    "network",
    "yt-dlp",
    "ureq/cookies",
    "ureq/multipart",
]
# Review-first Opus attachments created through Evernote's EDAM API. Generated
# Thrift bindings, resource hashing, caption retrieval, and the network client
# stay removable for distributors that do not use Evernote.
evernote = [
    "controller",
    "network",
    "yt-dlp",
    "dep:evernote",
    "dep:md5",
    "dep:thrift",
]
# On-demand local-file Chromaprint fingerprinting and AcoustID lookup.
#
# The official `fpcalc` helper performs media decoding and fingerprinting, so
# this feature does not add a second Rust media-decoding stack.
acoustid = ["network", "local-browser"]
# Compatibility umbrella retaining every Local-file capability.
local = [
    "local-browser",
    "local-metadata",
    "local-rename",
    "local-trash",
    "local-move",
    "local-artwork",
    "local-video-thumbnails",
]
# Read-only directory browsing and local-media playback.
local-browser = []
# Tag, codec, and technical metadata extraction.
local-metadata = ["local-browser", "dep:encoding_rs", "dep:lofty"]
# Restart-safe no-overwrite local-file renaming.
local-rename = ["local-browser", "dep:rustix"]
# Recoverable platform Trash integration.
local-trash = ["local-browser", "dep:trash"]
# No-overwrite file and directory movement with durable identity remapping.
local-move = ["local-browser", "dep:rustix"]
# Embedded and sidecar artwork discovery. Rendering additionally requires
# `images`, so `local` remains usable in text-only builds.
#
# Extraction publishes its result through the same private artwork cache as
# `remote-artwork`, so it selects that half of `src/artwork.rs` — the hashed,
# confined cache — without selecting the network half. A window renders these
# covers while linking no terminal renderer at all.
local-artwork = ["local-metadata", "dep:sha2"]
# Lazy midpoint-frame thumbnails for local video files. Rendering additionally
# requires `images`; extraction uses the user's existing FFmpeg executable.
local-video-thumbnails = ["local-browser"]
rss = ["network", "dep:feed-rs", "dep:sha2"]
invidious = ["network", "dep:percent-encoding"]
peertube = ["network"]
vimeo = ["yt-dlp"]
rutube = ["yt-dlp"]
youtube-official = ["network"]
youtube-music = ["yt-dlp"]
yt-dlp = ["dep:rustix"]
sponsorblock = ["network"]
dearrow = ["network"]
wikidata = ["network"]
# Compatibility alias retained for older custom build scripts.
wikimedia = ["commons-upload"]
archive-org = ["network"]
librivox = ["network"]
apple-podcasts = ["rss"]
litres = ["network", "dep:sha2"]
podcast-index = ["rss"]
gpodder = ["rss"]
radio = ["network"]
bbc-radio = ["radio"]
funkwhale = ["network"]
jamendo = ["network"]
soundcloud = ["network", "yt-dlp"]
soundstream = ["network"]
generic-ytdlp = ["yt-dlp"]
tracker-music = [
    "archive-zip",
    "network",
    "dep:delharc",
    "dep:flate2",
    "dep:quick-xml",
    "dep:sha2",
]
lastfm = ["network"]
discord = []

# Optional remote storage and service adapters.
google-drive = ["network"]
yandex-disk = ["network"]
webdav = ["network"]
ssh = []
telegram = []
bandcamp = ["network", "yt-dlp"]
odysee = ["network"]
rumble = ["network"]
bilibili = ["network"]
yandex-music = [
    "network",
    "dep:aes",
    "dep:base64",
    "dep:ctr",
    "dep:hmac",
    "dep:sha2",
]
vk = ["network"]

# Optional archive and peer-to-peer support.
archive-zip = ["dep:zip"]
archive-rar = []
# Read-only ZIP/RAR folders in the Local browser. ZIP decoding stays in-process;
# RAR decoding uses the system `unrar` helper to preserve portable cross-builds.
local-archives = ["local-browser", "archive-zip", "dep:sha2"]
torrent = []

# Portable release builds can opt into a bundled SQLite library. Distribution
# packages should prefer their system SQLite.
bundled-sqlite = ["sqlite-state", "rusqlite/bundled"]

[dependencies]
aes = { version = "0.8.4", optional = true }
anyhow = { version = "1.0.104", optional = true }
base64 = { version = "0.22.1", optional = true }
chrono = { version = "0.4.45", default-features = false, features = ["clock"], optional = true }
clap = { version = "4.6.4", features = ["derive"], optional = true }
crossbeam-channel = { version = "0.5.16", optional = true }
ctr = { version = "0.9.2", optional = true }
directories = "6.0.0"
evernote = { version = "0.1.2", optional = true }
figment = { version = "0.10.19", features = ["env", "toml"] }
hmac = { version = "0.12.1", optional = true }
opml = { version = "1.1.6", optional = true }
percent-encoding = { version = "2.3.2", optional = true }
qrcode = { version = "0.14.1", default-features = false, optional = true }
rusqlite = { version = "0.40.1", default-features = false, features = ["cache"], optional = true }
rustix = { version = "1.1.4", features = ["fs", "process"], optional = true }
rustfft = { version = "6.4.1", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
toml = "0.8.23"
toml_edit = { version = "0.22.27", optional = true }
unicode-segmentation = { version = "1.13.3", optional = true }
url = { version = "2.5.8", features = ["serde"] }

crossterm = { version = "0.29.0", optional = true }
delharc = { version = "0.7.0", optional = true }
encoding_rs = { version = "0.8.35", optional = true }
feed-rs = { version = "2.4.0", optional = true }
flate2 = { version = "1.1.9", optional = true }
lofty = { version = "0.24.0", optional = true }
mio = { version = "1.2.0", features = ["net", "os-ext", "os-poll"], optional = true }
md5 = { version = "0.8.0", optional = true }
trash = { version = "5.2.5", optional = true }
thrift = { version = "0.17.0", optional = true }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"], optional = true }
jpeg-decoder = { version = "0.3.2", default-features = false, optional = true }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache"], optional = true }
ratatui-image = { version = "=11.0.6", default-features = false, features = ["crossterm"], optional = true }
quick-xml = { version = "0.41.0", features = ["serialize"], optional = true }
sha2 = { version = "0.10.9", optional = true }
ureq = { version = "3.3.0", features = ["json"], optional = true }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"], optional = true }

# Windows has no stable `std` route to a file's identity: the volume serial
# number and file index sit behind the unstable `windows_by_handle` feature.
# Unix needs nothing here, so this is compiled only where it is the difference
# between noticing a replaced file and not.
[target.'cfg(windows)'.dependencies]
file-id = "0.2.3"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"

# The crate is compiled once per feature combination, and `app.rs` alone is
# 58k lines, so full DWARF and per-combination incremental caches cost tens of
# gigabytes in `target/`. Line tables keep `file:line` in panics and test
# failures, which is what debugging here actually relies on.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.release]
codegen-units = 1
debug = "line-tables-only"
lto = "thin"
opt-level = 3
panic = "unwind"
strip = "none"

[profile.release-small]
inherits = "release"
debug = 0
lto = true
opt-level = "z"
panic = "abort"
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
