[package]
name = "youta-gui"
version = "0.27.2"
edition = "2024"
rust-version = "1.95"
description = "Desktop front-end for the Youta player, sharing its reducer with the terminal UI"
license = "MIT"
repository = "https://github.com/vitaly-zdanevich/youta"
publish = false

[lints.rust]
unsafe_code = "forbid"

[dependencies]
# The reducer, the view contract, persistence, providers, and playback come
# from the shared crate. `controller` deliberately excludes the terminal
# renderer, so Crossterm and Ratatui never enter this binary.
youta = { path = "..", default-features = false, features = ["controller", "sources", "remote-artwork", "qr"] }

percent-encoding = "2.3"
serde = { version = "1.0", features = ["derive"] }
url = "2.5"
serde_json = "1.0"
tauri = { version = "2", features = [] }
# The platform clipboard, used from Rust on the reducer thread rather than from
# the web view: a copy is decided by the controller, so nothing is gained by
# routing the text out to JavaScript and back, and the window's capability list
# stays as small as it is.
tauri-plugin-clipboard-manager = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
# `test` supplies the mock runtime, so the reducer's lifecycle is exercised
# without a real window — the window itself is what cannot be scripted.
tauri = { version = "2", features = ["test"] }
tempfile = "3.27.0"
