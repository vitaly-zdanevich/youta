<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Youta</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <nav class="tabs" id="tabs" aria-label="Sources"></nav>

    <main class="body">
      <section class="list" id="list" aria-label="Results"></section>
      <aside class="details" id="details" aria-label="Details"></aside>
    </main>

    <footer class="player">
      <div class="track">
        <div class="bar">
          <div class="buffered" id="buffered"></div>
          <i id="progress"></i>
          <input
            type="range"
            id="seek"
            class="scrub"
            min="0"
            max="1000"
            step="1"
            value="0"
            aria-label="Playback position"
          />
        </div>
        <div class="times">
          <span class="num" id="position">0:00</span>
          <span id="now-playing"></span>
          <span class="num" id="duration">--:--</span>
        </div>
      </div>

      <div class="transport">
        <div class="group">
          <button type="button" id="back" title="Back 5 seconds" aria-label="Back 5 seconds">↶</button>
          <button type="button" id="play-pause" class="primary" aria-label="Play">▶</button>
          <button type="button" id="forward" title="Forward 5 seconds" aria-label="Forward 5 seconds">↷</button>
        </div>

        <div class="group" id="chapters" hidden>
          <button type="button" id="chapter-back" aria-label="Previous chapter">|◀</button>
          <span class="chapter" id="chapter-label"></span>
          <button type="button" id="chapter-forward" aria-label="Next chapter">▶|</button>
        </div>

        <div class="group">
          <button type="button" id="slower" aria-label="Slower">−</button>
          <span class="num speed" id="speed">1.00×</span>
          <button type="button" id="faster" aria-label="Faster">+</button>
        </div>

        <div class="group toggles">
          <button type="button" id="repeat" aria-pressed="false">Repeat</button>
          <button type="button" id="autoplay" aria-pressed="false">Autoplay</button>
        </div>

        <div class="group volume">
          <button type="button" id="quieter" aria-label="Quieter">🔈</button>
          <input
            type="range"
            id="volume"
            min="0"
            max="100"
            step="1"
            value="100"
            aria-label="Volume"
          />
          <button type="button" id="louder" aria-label="Louder">🔊</button>
          <span class="num level" id="volume-level">100</span>
        </div>

        <div class="output" id="output" title="Configured audio output"></div>
      </div>
    </footer>

    <p class="status" id="status"></p>

    <script src="./app.js"></script>
  </body>
</html>
